# Copy this file and replace MODEL_ID when using a stronger remote model.
#
# Set credentials in the shell instead of committing them:
#   export OPENAI_BASE_URL=https://your-endpoint.example/v1
#   export OPENAI_API_KEY=...
#
# If the provider supports a request seed, you can set vary_api_seed: true.
# If it does not support strict json_schema structured output, set
# structured_output: false; the parser will still require valid JSON.

experiment: micro_pair_probe_api
output_dir: runs

scenario: sender_receiver_newest_intent
conditions:
  - ck0
  - ck1_private
  - ck2_shared
  - ck3_mutual
  - ck_inf_common

ck1_informed_players: [0]

repetitions: 20
sample_seed_start: 0
receiver_seed_offset: 1000000
sender_shadow_probe: true
sender_probe_seed_offset: 2000000

# Conservative default for third-party OpenAI-compatible providers.
vary_api_seed: false
shuffle_legal_actions: true
sender_action_order_seed: 20262001
receiver_action_order_seed: 20262002
condition_order_seed: 20262003

convention: >-
  If a player gives a rank hint that touches the receiver's newest card,
  the receiver should interpret that newest card as intended to be played
  as soon as it is safe to do so.

agent:
  type: openai_compatible
  name: stronger_remote_model
  model: MODEL_ID
  temperature: 0.0
  timeout_s: 180
  max_tokens: 256
  structured_output: true

agent_error_policy: abort
log_raw_model_responses: true
