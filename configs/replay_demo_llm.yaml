# One full game with the established OpenRouter GPT-5.4 settings.
# Credentials: OPENROUTER_API_KEY (preferred) or OPENAI_API_KEY.
experiment: replay_demo_llm
output_dir: runs
num_players: 2
seeds:
- 0
conditions:
- ck3_mutual
convention: If a player gives a rank hint that touches the receiver's newest card,
  the receiver should interpret that newest card as intended to be played as soon
  as it is safe to do so.
agents:
- type: openai_compatible
  name: gpt-5.4_A
  model: openai/gpt-5.4
  base_url: https://openrouter.ai/api/v1
  temperature: null
  timeout_s: 180
  max_tokens: 2048
  structured_output: true
  extra_body:
    provider:
      order:
      - openai
      allow_fallbacks: false
    reasoning:
      effort: medium
- type: openai_compatible
  name: gpt-5.4_B
  model: openai/gpt-5.4
  base_url: https://openrouter.ai/api/v1
  temperature: null
  timeout_s: 180
  max_tokens: 2048
  structured_output: true
  extra_body:
    provider:
      order:
      - openai
      allow_fallbacks: false
    reasoning:
      effort: medium
agent_error_policy: abort
log_private_instructions: true
log_raw_model_responses: true
log_request_payloads: true
mechanical_scaffold: derived
