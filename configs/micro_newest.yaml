experiment: micro_newest
output_dir: runs

scenario: newest_rank1_three_safe
conditions:
  - ck0
  - ck1_private
  - ck2_shared
  - ck3_mutual
  - ck_inf_common

# The acting player in this scenario is P1. For CK1 we counterbalance the
# private convention onto the receiver so the one-step test actually measures
# private convention knowledge rather than a player who never received it.
ck1_informed_players: [1]

repetitions: 100
sample_seed_start: 0
vary_api_seed: true

# Run a separate stateless intention probe after the action call. Probe output
# is never fed back into the action context.
shadow_intention_probe: true
probe_seed_offset: 1000000

# Shuffle the indexed legal-action list per repetition to reduce position bias.
# The same repetition uses the same action order in every CK condition.
shuffle_legal_actions: true
action_order_seed: 20261002

# Randomize the order in which CK conditions are executed inside each
# repetition, so condition is not confounded with wall-clock/server drift.
condition_order_seed: 20261003

convention: >-
  If a player gives a rank hint that touches the receiver's newest card,
  the receiver should interpret that newest card as intended to be played
  as soon as it is safe to do so.

agent:
  type: openai_compatible
  name: llm_receiver
  model: qwen/qwen3.8-27b
  base_url: http://localhost:1234/v1
  temperature: 0.7
  timeout_s: 300
  max_tokens: 256
  structured_output: true
  extra_body:
    top_p: 0.8
    top_k: 20
    presence_penalty: 1.5
    chat_template_kwargs:
      enable_thinking: false
      preserve_thinking: false

agent_error_policy: abort
log_private_instructions: true
log_raw_model_responses: true
