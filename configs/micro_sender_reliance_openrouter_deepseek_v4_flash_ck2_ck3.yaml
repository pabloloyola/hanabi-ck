experiment: micro_sender_reliance_openrouter_deepseek_v4_flash_ck2_ck3
output_dir: runs

scenario: sender_reliance_ck2_ck3
conditions:
  - ck2_shared
  - ck3_mutual

# Matched to the GPT-5.4 screen:
# 20 paired repetitions x 2 conditions x sender-only = 40 calls.
repetitions: 20
sample_seed_start: 0
sender_only: true
sender_shadow_probe: false
vary_api_seed: false
shuffle_legal_actions: true
sender_action_order_seed: 20262001
condition_order_seed: 20262003

convention: >-
  If a player gives a rank hint that touches the receiver's newest card,
  the receiver should interpret that newest card as intended to be played
  as soon as it is safe to do so.

agent:
  type: openai_compatible
  name: deepseek-v4-flash
  model: deepseek/deepseek-v4-flash
  base_url: https://openrouter.ai/api/v1
  temperature: 0.0
  timeout_s: 180
  max_tokens: 2048
  structured_output: true
  extra_body:
    provider:
      order: ["venice"]
      allow_fallbacks: false

agent_error_policy: abort
log_raw_model_responses: true
